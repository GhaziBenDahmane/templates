version: "3.8"

services:
  barktrace-postgres:
    image: ghcr.io/barktrace/bark:0.31.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BARKTRACE_PUBLIC_URL: https://${BARKTRACE_HOST}
      BARKTRACE_DATABASE_URL: postgresql://barktrace:${POSTGRES_PASSWORD}@postgres:5432/barktrace?sslmode=disable
      BARKTRACE_DEFAULT_ORG_NAME: ${BARKTRACE_DEFAULT_ORG_NAME}
      BARKTRACE_DEFAULT_ORG_SLUG: ${BARKTRACE_DEFAULT_ORG_SLUG}
      BARKTRACE_AUTO_PROVISION: "true"
      BARKTRACE_SESSION_LIFETIME_HOURS: "720"
      BARKTRACE_MCP_TOKEN: ${BARKTRACE_MCP_TOKEN}
      BARKTRACE_UPTIME_ALLOW_PRIVATE_TARGETS: "false"
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_REDIRECT_URL: https://${BARKTRACE_HOST}/auth/oidc/callback
      OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME}
      OIDC_SCOPES: "openid email profile"
      OIDC_REQUIRE_EMAIL_VERIFIED: "true"
      GOMEMLIMIT: 192MiB
    volumes:
      - barktrace-postgres-data:/data
    expose:
      - 8080
    healthcheck:
      test: ["CMD", "/app/barktrace", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 5

  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: barktrace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: barktrace
    volumes:
      - barktrace-postgres-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barktrace -d barktrace"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  barktrace-postgres-data:
  barktrace-postgres-db:
