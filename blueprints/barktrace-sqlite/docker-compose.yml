version: "3.8"

services:
  barktrace-sqlite:
    image: ghcr.io/barktrace/bark:0.31.0
    restart: unless-stopped
    environment:
      BARKTRACE_PUBLIC_URL: https://${BARKTRACE_HOST}
      BARKTRACE_DEFAULT_ORG_NAME: ${BARKTRACE_DEFAULT_ORG_NAME}
      BARKTRACE_DEFAULT_ORG_SLUG: ${BARKTRACE_DEFAULT_ORG_SLUG}
      BARKTRACE_AUTO_PROVISION: "true"
      BARKTRACE_SESSION_LIFETIME_HOURS: "720"
      BARKTRACE_MCP_TOKEN: ${BARKTRACE_MCP_TOKEN}
      BARKTRACE_UPTIME_ALLOW_PRIVATE_TARGETS: "false"
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_REDIRECT_URL: https://${BARKTRACE_HOST}/auth/oidc/callback
      OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME}
      OIDC_SCOPES: "openid email profile"
      OIDC_REQUIRE_EMAIL_VERIFIED: "true"
      GOMEMLIMIT: 192MiB
    volumes:
      - barktrace-sqlite-data:/data
    expose:
      - 8080
    healthcheck:
      test: ["CMD", "/app/barktrace", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 5

volumes:
  barktrace-sqlite-data:
